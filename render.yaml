services:
  # ---------------------------------------------------------------------------
  # 1. API Web Service (Express HTTP + Meta WhatsApp Webhook + Public Pass)
  # ---------------------------------------------------------------------------
  - type: web
    name: campus-mess-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma migrate deploy --schema=prisma/schema.prisma
    startCommand: npm run start --workspace=@campus-mess/backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: campus-mess-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://admin.campusmess.in
      - key: DEFAULT_MESS_CODE
        value: AKSHAYA
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: mess@campusmess.in
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Background Worker Service (pg-boss Outbox, Emails, WhatsApp Push)
  # ---------------------------------------------------------------------------
  - type: worker
    name: campus-mess-worker
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:worker --workspace=@campus-mess/backend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-mess-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://admin.campusmess.in
      - key: DEFAULT_MESS_CODE
        value: AKSHAYA
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: mess@campusmess.in
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database Instance with Automated Backups
# -----------------------------------------------------------------------------
databases:
  - name: campus-mess-db
    databaseName: campus_mess
    user: campus_admin
    plan: starter
    region: singapore
    postgresMajorVersion: "16"
