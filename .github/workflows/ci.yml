name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: campus_mess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/campus_mess_test
      SESSION_SECRET: test_session_secret_at_least_32_characters_long
      PAYOUT_ENCRYPTION_KEY: test_payout_encryption_key_16char
      DEFAULT_MESS_CODE: AKSHAYA

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Lint Workspaces
        run: npm run lint

      - name: Run Test Suites
        run: npm run test

      - name: Build Packages
        run: npm run build
