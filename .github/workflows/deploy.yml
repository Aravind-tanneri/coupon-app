name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Secrets & Trigger Server Deployment
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER != '' && secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/coupon-app || cd /var/www/coupon-app
            bash deploy.sh
